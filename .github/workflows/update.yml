name: Update Dividend Calendar

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python dividends.py

      - name: Commit updated calendar
        run: |
          git config user.name "Dividend Calendar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add dividends.ics

          git diff --cached --quiet || \
            git commit -m "Update dividend calendar"

          git push
